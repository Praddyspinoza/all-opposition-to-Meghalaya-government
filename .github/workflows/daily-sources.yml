name: Daily public source collection

# GitHub schedule is best-effort. An independent Cloudflare Cron Worker invokes
# workflow_dispatch in time for the morning refresh.
on:
  schedule:
    - cron: '13 23 * * *' # 04:43 IST on the following calendar day
    - cron: '17 0 * * *'  # 05:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record actual start time
        run: |
          python - <<'PY'
          from datetime import datetime, timezone, timedelta
          now = datetime.now(timezone.utc)
          local = now.astimezone(timezone(timedelta(hours=5, minutes=30)))
          print(f"Run started at {now.isoformat()} UTC / {local.isoformat()} IST")
          if local.hour >= 7:
              print('::warning::Refresh started after 07:00 IST; review external dispatcher')
          PY
      - name: Collect public source links
        run: python scripts/collect_sources.py
      - name: Validate refreshed feed
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('daily_sources.json', encoding='utf-8') as f:
              feed = json.load(f)
          assert isinstance(feed.get('records'), list) and feed['records'], 'Source records unexpectedly empty'
          t = datetime.fromisoformat(feed['last_checked_utc'].replace('Z', '+00:00'))
          assert t.tzinfo is not None and abs((datetime.now(timezone.utc) - t).total_seconds()) < 900
          print(f"Validated {len(feed['records'])} records at {t.isoformat()}")
          PY
      - name: Commit changed records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily public source links"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
